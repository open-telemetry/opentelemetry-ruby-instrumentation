name: Publish Ruby Auto-Instrumentation Image

on:
  push:
    branches:
      - main
    paths: &path_filters
      - "docker/**"
      - ".github/workflows/publish-autoinstrumentation-ruby.yml" 
  pull_request:
    branches:
      - main
    paths: *path_filters
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    permissions:
      contents: read
      packages: write # required for pushing the image to ghcr.io
    runs-on: ubuntu-24.04
    env:
      # only push from the upstream repository; PRs and forks build without pushing             
      PUSH: ${{ github.repository == 'open-telemetry/opentelemetry-ruby-instrumentation' && github.event_name != 'pull_request' }} 
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read version
        id: version
        run: echo "version=$(cat docker/version.txt)" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository }}/autoinstrumentation-ruby
          tags: |
            type=match,pattern=v(.*),group=1,value=v${{ steps.version.outputs.version }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GitHub Package Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: docker
          platforms: linux/amd64,linux/arm64,linux/s390x,linux/ppc64le
          push: ${{ env.PUSH == 'true' }}
          build-args: version=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
